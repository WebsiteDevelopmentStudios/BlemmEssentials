name: Build BlemmEssentials

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25', cache: maven }
      - name: Build Paper plugin
        run: mvn -B -f paper/pom.xml package
      - uses: actions/upload-artifact@v4
        with: { name: paper-jar, path: paper/target/BlemmEssentials-*.jar }

  fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Build Fabric mod
        run: gradle -p fabric build
      - uses: actions/upload-artifact@v4
        with: { name: fabric-jar, path: fabric/build/libs/*.jar }

  neoforge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Build NeoForge mod
        run: gradle -p neoforge build
      - uses: actions/upload-artifact@v4
        with: { name: neoforge-jar, path: neoforge/build/libs/*.jar }

  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build Forge mod
        run: gradle -p forge build
      - uses: actions/upload-artifact@v4
        with: { name: forge-jar, path: forge/build/libs/*.jar }

  bundle:
    needs: [paper, fabric, neoforge, forge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: false }
      - name: Assemble platform jars
        run: |
          mkdir -p bundle/paper bundle/fabric bundle/neoforge bundle/forge
          cp artifacts/paper-jar/*.jar bundle/paper/
          cp artifacts/fabric-jar/*.jar bundle/fabric/
          cp artifacts/neoforge-jar/*.jar bundle/neoforge/
          cp artifacts/forge-jar/*.jar bundle/forge/
          cd bundle && zip -r ../BlemmEssentials-all-platforms.zip .
      - uses: actions/upload-artifact@v4
        with: { name: BlemmEssentials-all-platforms, path: BlemmEssentials-all-platforms.zip }
