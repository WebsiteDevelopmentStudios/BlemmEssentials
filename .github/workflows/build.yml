name: Build BlemmEssentials

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25', cache: maven }
      - name: Build Paper plugin
        run: mvn -B -f paper/pom.xml package
      - uses: actions/upload-artifact@v4
        with: { name: paper-jar, path: paper/target/BlemmEssentials-*.jar }

  # Fabric / NeoForge / Forge ports: add a build job here once each project contains sources.
  # Each job should upload an artifact named fabric-jar / neoforge-jar / forge-jar.

  bundle:
    needs: [paper]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: false }
      - name: Assemble folders
        run: |
          mkdir -p bundle/paper bundle/fabric bundle/neoforge bundle/forge
          cp artifacts/paper-jar/*.jar bundle/paper/
          for d in fabric neoforge forge; do
            if ls artifacts/$d-jar/*.jar >/dev/null 2>&1; then cp artifacts/$d-jar/*.jar bundle/$d/;
            else cp $d/README.md bundle/$d/; fi
          done
          cd bundle && zip -r ../BlemmEssentials-all-platforms.zip .
      - uses: actions/upload-artifact@v4
        with: { name: BlemmEssentials-all-platforms, path: BlemmEssentials-all-platforms.zip }
